
services:
  afterglow:
    build: .
    restart: unless-stopped

    ports:
      - "${AFTERGLOW_PORT:-8000}:${AFTERGLOW_PORT:-8000}"

    environment:
      AFTERGLOW_PORT: "${AFTERGLOW_PORT:-8000}"

    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('AFTERGLOW_PORT', '8000') + '/', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
